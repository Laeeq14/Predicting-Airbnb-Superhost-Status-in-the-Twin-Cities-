[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    # Pre-existing project files — style not owned by this CI setup
    "ml_pipeline/train_model.py",
    "ml_pipeline/patch_metadata.py",
    "ml_pipeline/patch_metadata_amenity.py",
    "run_app.py",
    "scratch_agent_test.py",
    "scratch_amenity_analysis.py",
    # Notebooks and generated assets
    "*.ipynb",
    "app/static",
    # Standard ignores
    "__pycache__",
    ".venv",
    "catboost_info",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E501",   # line too long
    "E401",   # multiple imports on one line (pre-existing style in scripts)
]

[tool.ruff.lint.per-file-ignores]
# app/agent.py is pre-existing; F821 (undefined Any) is a latent bug we won't fix here
"app/agent.py" = ["F821", "I001", "E402"]
# model_loader.py is pre-existing
"app/model_loader.py" = ["I001"]

